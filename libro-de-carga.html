<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de Carga · Control Financiero de Estaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F6F4EF;
  --sidebar-bg:#FFFFFF;
  --card:#FFFFFF;
  --border:#EAE5DA;
  --border-soft:#F0EBE0;
  --text:#26241F;
  --text-dim:#78736A;
  --text-faint:#A6A096;
  --blue:#2F6FED;
  --blue-soft:#EAF0FD;
  --blue-dim:#1E56C8;
  --red:#E0524F;
  --red-soft:#FBEAE9;
  --orange:#F0A23D;
  --orange-soft:#FCF1DF;
  --green:#2FA868;
  --green-soft:#E8F6EE;
  --purple:#8B5CF6;
  --purple-soft:#F1EBFE;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:16px;
  --shadow-card:0 1px 2px rgba(38,36,31,.04), 0 8px 24px -12px rgba(38,36,31,.08);
  --shadow-pop:0 20px 50px -15px rgba(38,36,31,.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
::selection{background:var(--blue-soft);color:var(--blue-dim);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#DDD7C9;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#C9C2B0;}
.hidden{display:none !important;}
svg{display:block;}

.stamp-mark{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:100px;border:1px solid var(--border);text-transform:uppercase;}
.stamp-mark.borrador{color:var(--text-dim);border-color:var(--border);background:#FAF8F3;}
.stamp-mark.cargado{color:var(--orange);border-color:#F0D3A0;background:var(--orange-soft);}
.stamp-mark.validado{color:var(--green);border-color:#BEE6CE;background:var(--green-soft);}
.stamp-mark::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ============ LOGIN ============ */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:
  radial-gradient(ellipse 800px 500px at 12% -8%, rgba(240,162,61,.14), transparent 60%),
  radial-gradient(ellipse 700px 500px at 100% 105%, rgba(47,111,237,.10), transparent 55%),
  var(--bg);}
.login-card{width:100%;max-width:420px;position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:38px 34px 30px;box-shadow:var(--shadow-pop);}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em;}
.brand-name .a1{color:#232323;}
.brand-name .a2{color:var(--orange);}
.brand-name .a3{color:var(--blue);}
.brand-tag{font-size:11px;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
.login-card h1{font-family:var(--font-display);font-size:23px;font-weight:600;margin-bottom:6px;}
.login-card .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:26px;line-height:1.55;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px;font-weight:500;}
.field input{width:100%;background:#FBF9F5;border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:10px;font-size:14.5px;outline:none;transition:border-color .15s, box-shadow .15s;}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);background:#fff;}

.field select, .field-row select, .filter-group select{
  width:100%;
  background-color:#FFFFFF;
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 36px 10px 14px;
  border-radius:12px;
  font-size:13.5px;
  font-weight:500;
  outline:none;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1.5 2L6 6.5L10.5 2' stroke='%2378736A' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 14px center;
  box-shadow:0 1px 3px rgba(38,36,31,.04);
  transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
}
.field select:hover, .field-row select:hover, .filter-group select:hover{border-color:#D4CEBF;background-color:#FDFCF9;}
.field select:focus, .field-row select:focus, .filter-group select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);background-color:#FFFFFF;}

.btn{border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, filter .15s, background .15s, box-shadow .15s;letter-spacing:.01em;white-space:nowrap;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--blue);color:#fff;width:100%;padding:12px 18px;margin-top:6px;box-shadow:0 8px 20px -8px rgba(47,111,237,.55);}
.btn-primary:hover{background:var(--blue-dim);}
.btn-ghost{background:#fff;color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:#D8D2C4;}
.btn-teal{background:var(--green);color:#fff;}
.btn-teal:hover{filter:brightness(1.06);}
.btn-red{background:#fff;color:var(--red);border:1px solid #F3D2D0;}
.btn-red:hover{background:var(--red-soft);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.login-error{background:var(--red-soft);border:1px solid #F3D2D0;color:#B5433F;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:16px;}
.hint-toggle{text-align:center;margin-top:20px;font-size:12.5px;color:var(--text-faint);}
.hint-toggle span{color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.hint-box{margin-top:14px;background:#FBF9F5;border:1px dashed var(--border);border-radius:10px;padding:12px 14px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);line-height:1.9;}
.hint-box b{color:var(--text);}

/* ============ APP LAYOUT ============ */
#appShell{min-height:100vh;display:none;}
#appShell.active{display:flex;}
.app-layout{display:flex;width:100%;min-height:100vh;}

/* Sidebar */
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s ease;}
.sidebar.collapsed{width:76px;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;}
.sidebar-brand svg{flex-shrink:0;}
.sidebar.collapsed .brand-text{display:none;}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 12px;}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:14px 12px 6px;font-weight:600;}
.sidebar.collapsed .nav-section-label{display:none;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text);font-size:13.5px;font-weight:500;margin-bottom:2px;position:relative;transition:background .12s;}
.nav-item:hover{background:#F7F4EC;}
.nav-item.active{background:var(--blue-soft);color:var(--blue-dim);font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--blue);}
.nav-item .nav-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.nav-item.active .nav-icon{color:var(--blue);}
.sidebar.collapsed .nav-label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}
.sidebar-foot{padding:14px 20px 20px;border-top:1px solid var(--border-soft);}
.collapse-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text-dim);font-size:12.5px;font-weight:600;width:100%;padding:8px 4px;}
.collapse-btn:hover{color:var(--blue);}
.sidebar.collapsed .collapse-label{display:none;}
.sidebar.collapsed .collapse-btn{justify-content:center;}

/* Content column */
.content-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 30px;border-bottom:1px solid var(--border-soft);background:rgba(246,244,239,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;}
.topbar-context{font-size:13.5px;color:var(--text-dim);}
.topbar-context b{color:var(--text);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.user-chip{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);padding:6px 12px 6px 6px;border-radius:100px;font-size:13px;box-shadow:var(--shadow-card);}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#e08b1f);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.role-pill{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);}
.main{flex:1;padding:28px 30px 60px;max-width:1320px;width:100%;margin:0 auto;}

/* ============ Bienvenida ============ */
.welcome-hero{background:linear-gradient(120deg, #FFF7EA 0%, #FFFFFF 55%, #EFF5FF 100%);border:1px solid var(--border-soft);border-radius:20px;padding:34px 36px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:var(--shadow-card);}
.welcome-hero .wave{font-size:26px;}
.welcome-hero h1{font-family:var(--font-display);font-size:26px;font-weight:700;margin:10px 0 8px;}
.welcome-hero p{color:var(--text-dim);font-size:14px;max-width:560px;line-height:1.6;}
.welcome-shortcuts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:24px;}
.mini-card{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:20px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .12s, box-shadow .12s;}
.mini-card:hover{transform:translateY(-2px);box-shadow:0 20px 40px -18px rgba(38,36,31,.18);}
.mini-card .icon-badge{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.mini-card h4{font-size:14.5px;font-weight:600;margin-bottom:4px;}
.mini-card p{font-size:12px;color:var(--text-faint);}

/* ============ Panel headers ============ */
.panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.panel-title{font-family:var(--font-display);font-size:23px;font-weight:700;}
.panel-sub{color:var(--text-dim);font-size:13.5px;margin-top:4px;}
.filter-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-group select{background:#fff;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-card);}

.status-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow-card);}
.status-bar .left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.status-meta{font-size:12px;color:var(--text-faint);}
.status-actions{display:flex;gap:8px;flex-wrap:wrap;}

.notas-admin{background:var(--red-soft);border:1px solid #F3D2D0;border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#9E3C38;}
.notas-admin b{color:#7c2b28;}
.notas-empresa{background:var(--blue-soft);border:1px solid #CFE0FB;border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#264C9E;}
.notas-empresa b{color:#1a3a80;}

.content-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start;}
@media (max-width:960px){.content-grid{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow-card);}
.card h3{font-family:var(--font-display);font-size:15.5px;font-weight:600;margin-bottom:2px;}
.card .card-sub{font-size:12px;color:var(--text-faint);margin-bottom:16px;}

.dropzone{border:1.5px dashed var(--border);border-radius:14px;padding:32px 20px;text-align:center;transition:border-color .15s, background .15s;cursor:pointer;background:#FBF9F5;}
.dropzone:hover, .dropzone.drag{border-color:var(--blue);background:var(--blue-soft);}
.dropzone svg{margin:0 auto 10px;opacity:.65;}
.dropzone .dz-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.dropzone .dz-sub{font-size:12px;color:var(--text-faint);}

.file-card{display:flex;align-items:center;gap:14px;background:#FBF9F5;border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;}
.file-icon{width:42px;height:42px;border-radius:10px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
.file-info{flex:1;min-width:0;}
.file-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-meta{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);margin-top:2px;}
.file-actions{display:flex;gap:6px;flex-shrink:0;}

.preview-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;border-bottom:1px solid var(--border-soft);padding-bottom:1px;}
.preview-tab{background:transparent;border:none;color:var(--text-dim);padding:7px 12px;font-size:12.5px;border-bottom:2px solid transparent;white-space:nowrap;border-radius:8px 8px 0 0;}
.preview-tab.active{color:var(--blue-dim);border-color:var(--blue);background:var(--blue-soft);}
.preview-scroll{overflow:auto;max-height:420px;border:1px solid var(--border-soft);border-radius:10px;}
table.preview-table{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%;}
table.preview-table td, table.preview-table th{border:1px solid var(--border-soft);padding:5px 9px;white-space:nowrap;font-family:var(--font-mono);}
table.preview-table tr:first-child td{background:#F7F4EC;color:var(--text-dim);font-weight:600;}
table.preview-table td.rownum{background:#FBF9F5;color:var(--text-faint);text-align:center;font-family:var(--font-mono);}

.field-row{margin-bottom:14px;}
.field-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field-row input, .field-row textarea{width:100%;background:#FBF9F5;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:13.5px;outline:none;}
.field-row input:focus, .field-row textarea:focus{border-color:var(--blue);background:#fff;}
.field-row textarea{resize:vertical;min-height:70px;}
.field-row input.num{font-family:var(--font-mono);}
.mini-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-card);}
.kpi-card .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-card .icon-badge{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.kpi-card .label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
.kpi-card .value{font-family:var(--font-display);font-size:26px;font-weight:700;}

.icon-badge.blue{background:var(--blue-soft);color:var(--blue);}
.icon-badge.orange{background:var(--orange-soft);color:var(--orange);}
.icon-badge.green{background:var(--green-soft);color:var(--green);}
.icon-badge.red{background:var(--red-soft);color:var(--red);}
.icon-badge.purple{background:var(--purple-soft);color:var(--purple);}

.admin-table-wrap{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;overflow-x:auto;margin-bottom:24px;box-shadow:var(--shadow-card);}
.admin-table-wrap .thead-row{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.admin-table-wrap h3{font-family:var(--font-display);font-size:16px;}
table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
table.admin-table thead th{text-align:left;padding:10px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);border-bottom:1px solid var(--border-soft);white-space:nowrap;}
table.admin-table tbody td{padding:12px 18px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
table.admin-table tbody tr:last-child td{border-bottom:none;}
table.admin-table tbody tr:hover{background:#FBFAF6;}
.company-name-cell{display:flex;align-items:center;gap:10px;font-weight:500;}
.company-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.check-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-size:13px;}
.check-icon.yes{background:var(--green-soft);color:var(--green);}
.check-icon.no{background:#F3F1EA;color:var(--text-faint);}
.file-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);flex-wrap:wrap;}
.ext-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--font-mono);background:var(--blue-soft);color:var(--blue-dim);text-transform:uppercase;letter-spacing:.03em;}
.user-chip-sm{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text);font-weight:500;background:#F6F4EF;padding:3px 8px;border-radius:6px;border:1px solid var(--border-soft);}

.manage-grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;}
@media (max-width:960px){.manage-grid{grid-template-columns:1fr;}}
.manage-card{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:22px;box-shadow:var(--shadow-card);}
.manage-card h3{font-family:var(--font-display);font-size:15.5px;margin-bottom:4px;}
.manage-card .card-sub{font-size:12px;color:var(--text-faint);margin-bottom:16px;}
.mini-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;}
.mini-list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#FBF9F5;border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;font-size:13px;}
.mini-list-item .meta{color:var(--text-faint);font-size:11.5px;font-family:var(--font-mono);margin-top:2px;}
.mini-list-item .actions{display:flex;gap:6px;flex-shrink:0;}

.detail-view .company-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:16px;background:none;border:none;}
.back-link:hover{color:var(--blue);}

.validate-bar{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:20px 22px;margin-top:22px;box-shadow:var(--shadow-card);}
.validate-bar h4{font-family:var(--font-display);font-size:15px;margin-bottom:10px;}
.validate-bar textarea{width:100%;background:#FBF9F5;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:13.5px;resize:vertical;min-height:64px;margin-bottom:12px;outline:none;}
.validate-bar textarea:focus{border-color:var(--blue);}
.validate-actions{display:flex;gap:10px;flex-wrap:wrap;}

.stamp-graphic{position:relative;width:68px;height:68px;border-radius:50%;border:3px solid var(--green);display:flex;align-items:center;justify-content:center;transform:rotate(-11deg);flex-shrink:0;box-shadow:0 0 0 3px var(--green-soft);}
.stamp-graphic span{font-family:var(--font-mono);font-size:8.5px;font-weight:700;color:var(--green);letter-spacing:.03em;text-align:center;line-height:1.3;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}

.activity-item:last-child{border-bottom:none;}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.activity-dot.validado{background:var(--green);}
.activity-dot.cargado{background:var(--orange);}
.activity-text{font-size:13px;flex:1;}
.activity-text b{font-weight:600;}
.activity-time{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap;}

/* ============ GRAFICOS VISUALES & METRICAS ============ */
.dist-graphic-card{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow-card);}
.dist-graphic-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.dist-graphic-title{font-family:var(--font-display);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.dist-bar-track{width:100%;height:14px;background:#F0EBE0;border-radius:20px;overflow:hidden;display:flex;margin-bottom:16px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.06);}
.dist-bar-seg{height:100%;transition:width .4s ease;}
.dist-bar-seg.validado{background:linear-gradient(90deg, #2FA868, #28965c);}
.dist-bar-seg.cargado{background:linear-gradient(90deg, #F0A23D, #e09432);}
.dist-bar-seg.pendiente{background:linear-gradient(90deg, #D4CEBF, #C4BDAD);}
.dist-legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;}
.dist-legend-item{display:flex;align-items:center;gap:7px;font-weight:500;}
.dist-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

.chart-container{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
.chart-row{display:flex;align-items:center;gap:12px;font-size:12.5px;}
.chart-label{width:160px;flex-shrink:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chart-bars{flex:1;display:flex;flex-direction:column;gap:4px;}
.chart-bar-bg{width:100%;height:10px;background:#F6F4EF;border-radius:6px;overflow:hidden;position:relative;}
.chart-bar-fill{height:100%;border-radius:6px;transition:width .4s ease;}
.chart-bar-fill.ingresos{background:linear-gradient(90deg, #2F6FED, #4982f2);}
.chart-bar-fill.gastos{background:linear-gradient(90deg, #E0524F, #e66866);}
.chart-val{width:90px;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);flex-shrink:0;}

.flujo-neto-card{background:linear-gradient(135deg, #FBF9F5 0%, #FFFFFF 100%);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;box-shadow:var(--shadow-card);}
.flujo-neto-val{font-family:var(--font-display);font-size:20px;font-weight:700;margin-top:4px;}
.flujo-neto-val.positive{color:var(--green);}
.flujo-neto-val.negative{color:var(--red);}

.menu-toggle-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);padding:6px;border-radius:8px;cursor:pointer;transition:background .15s;}
.menu-toggle-btn:hover{background:#F7F4EC;}

.modal-overlay{position:fixed;inset:0;background:rgba(38,36,31,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .18s ease;}

.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

/* Toast elegante */
.toast{position:fixed;bottom:24px;right:24px;background:#FFFFFF;color:var(--text);padding:14px 20px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:200;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px -10px rgba(38,36,31,.22);border:1px solid var(--border);transform:translateY(30px);opacity:0;transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1),opacity .3s;max-width:380px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;}
.toast.success .toast-icon{background:var(--green-soft);color:var(--green);}
.toast.err .toast-icon{background:var(--red-soft);color:var(--red);}
.toast.info .toast-icon{background:var(--blue-soft);color:var(--blue);}

/* ---------------- Report helpers ---------------- */
function reportId(companyId, periodo){ return companyId + '__' + periodo; }
function blankReport(companyId, periodo){
  return { companyId, periodo, file:null,
    resumen:{ totalIngresos:'', totalGastos:'', totalCostos:'', saldoBancoCaja:'' },
    notasEmpresa:'', status:'borrador',
    cargadoPor:null, cargadoFecha:null, validadoPor:null, validadoFecha:null, notasAdmin:'' };
}
function getReport(companyId, periodo, create){
  const id = reportId(companyId, periodo);
  if(!DB.reports[id] && create){ DB.reports[id] = blankReport(companyId, periodo); }
  return DB.reports[id] || null;
}
function ensureReport(companyId, periodo){
  const id = reportId(companyId, periodo);
  if(!DB.reports[id]) DB.reports[id] = blankReport(companyId, periodo);
  return DB.reports[id];
}
function fmt(n){ const v=parseFloat(n); return (isFinite(v)?v:0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtBytes(b){ if(b<1024) return b+' B'; if(b<1024*1024) return (b/1024).toFixed(1)+' KB'; return (b/(1024*1024)).toFixed(2)+' MB'; }

/* ---------------- File <-> base64 helpers ---------------- */
function arrayBufferToBase64(buffer){
  let binary=''; const bytes=new Uint8Array(buffer); const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return window.btoa(binary);
}
function base64ToBlob(base64, mime){
  const binary=window.atob(base64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function base64ToArrayBuffer(base64){
  const binary=window.atob(base64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}

    if(currentPage==='empresas') return renderAdminEmpresas();

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  document.getElementById('toastMsg').textContent = msg;
  t.className = 'toast show ' + (isErr ? 'err' : 'success');

function statusStamp(status){
  if(status==='validado') return `<span class="stamp-mark validado">Validado</span>`;
  if(status==='cargado') return `<span class="stamp-mark cargado">Cargado — pendiente</span>`;

function statusMeta(r){

/* =========================================================================
   PARSEO Y VISTA PREVIA DEL EXCEL (SheetJS)
   ========================================================================= */
function parseWorkbookFromBase64(base64){
  try{ const buf = base64ToArrayBuffer(base64); return XLSX.read(buf, { type:'array', cellDates:true }); }
  catch(e){ console.warn('No se pudo parsear el archivo', e); return null; }
}
function renderPreviewBlock(report, containerId){
  try {
    const el = document.getElementById(containerId);
    if(!el) return;
    if(!report.file || !report.file.base64){ el.innerHTML=''; return; }
    el.innerHTML = `<div class="empty-state"><p>Preparando vista previa…</p></div>`;
    setTimeout(() => {
      const wb = parseWorkbookFromBase64(report.file.base64);
      if(!wb || !wb.SheetNames || !wb.SheetNames.length){
        el.innerHTML = `<div class="empty-state"><p>Archivo adjunto recibido. Puedes descargarlo directamente para revisar su contenido.</p></div>`;
        return;
      }
      if(previewSheetIndex >= wb.SheetNames.length) previewSheetIndex = 0;
      const sheetName = wb.SheetNames[previewSheetIndex];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false });
      const limitedRows = rows.slice(0,200);
      const maxCols = Math.min(20, limitedRows.reduce((m,r)=>Math.max(m,r.length),0));
      el.innerHTML = `
        <div class="preview-tabs" id="previewTabs">
          ${wb.SheetNames.map((n,i)=>`<button class="preview-tab ${i===previewSheetIndex?'active':''}" data-sheet="${i}">${escapeHtml(n)}</button>`).join('')}
        </div>
        <div class="preview-scroll"><table class="preview-table"><tbody>
          ${limitedRows.map((r,ri)=>`<tr><td class="rownum">${ri+1}</td>${Array.from({length:maxCols}).map((_,ci)=>`<td>${escapeHtml(r[ci]??'')}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
        ${rows.length>200?`<div style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Mostrando las primeras 200 filas de ${rows.length}.</div>`:''}
      `;
      el.querySelectorAll('[data-sheet]').forEach(btn=>{
        btn.addEventListener('click', ()=>{ previewSheetIndex=parseInt(btn.dataset.sheet,10); renderPreviewBlock(report, containerId); });
      });
    }, 10);
  } catch(e) {
    console.warn('Error en la vista previa:', e);
    const el = document.getElementById(containerId);
    if(el) el.innerHTML = `<div class="empty-state"><p>El archivo de soporte se encuentra guardado y disponible para su descarga.</p></div>`;
  }
}

/* =========================================================================
   SUBIDA DE ARCHIVO
   ========================================================================= */
function handleFileUpload(file, report, onDone){
  if(!file) return;
  if(!/\.(xlsx|xls|xlsm|csv)$/i.test(file.name)){ showToast('Formato no soportado. Sube un .xlsx, .xls, .xlsm o .csv', true); return; }
  if(file.size > MAX_FILE_MB*1024*1024){ showToast('El archivo pesa más de '+MAX_FILE_MB+' MB.', true); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = arrayBufferToBase64(reader.result);
    const user = currentUser();
    report.file = { name:file.name, mime:file.type||'application/octet-stream', size:file.size, base64, uploadedAt:Date.now(), uploadedBy:user.name };
    saveDB(DB); previewSheetIndex=0;
    showToast('Archivo "'+file.name+'" cargado correctamente.');
    if(onDone) onDone();
  };
  reader.onerror = () => showToast('No se pudo leer el archivo. Intenta de nuevo.', true);
  reader.readAsArrayBuffer(file);
}
function downloadFile(fileObj){
  const blob = base64ToBlob(fileObj.base64, fileObj.mime);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=fileObj.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function triggerFilePicker(report, onChange){
  const input = document.getElementById('hiddenFileInput');
  input.value = '';
  input.onchange = () => handleFileUpload(input.files[0], report, onChange);
  input.click();
}
function renderFileArea(containerId, report, locked, onChange){
  const el = document.getElementById(containerId);
  if(!el) return;
  if(report.file){
    const ext = getFileExt(report.file.name);
    const uBy = report.cargadoPor || report.file.uploadedBy || 'Empresa';
    el.innerHTML = `
      <div class="file-card">
        <div class="file-icon">${ICONS.file}</div>
        <div class="file-info">
          <div class="file-name" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span>${escapeHtml(report.file.name)}</span>
            ${ext ? `<span class="ext-badge">${escapeHtml(ext)}</span>` : ''}
          </div>
          <div class="file-meta">${fmtBytes(report.file.size)} · por <b>${escapeHtml(uBy)}</b> · subido ${new Date(report.file.uploadedAt).toLocaleString('es-VE')}</div>
        </div>
        <div class="file-actions">
          <button class="btn btn-ghost btn-sm" id="dlBtn">Descargar</button>
          ${!locked?`<button class="btn btn-red btn-sm" id="rmBtn">Quitar</button>`:''}
        </div>
      </div>
      ${!locked?`<div style="margin-top:12px;"><button class="btn btn-ghost btn-sm" id="replaceBtn">Reemplazar archivo</button></div>`:''}
    `;
    el.querySelector('#dlBtn')?.addEventListener('click', ()=>downloadFile(report.file));
    el.querySelector('#rmBtn')?.addEventListener('click', ()=>{
      openConfirm('¿Quitar el archivo cargado para este período?', ()=>{ report.file=null; saveDB(DB); onChange(); });
    });
    el.querySelector('#replaceBtn')?.addEventListener('click', ()=>triggerFilePicker(report, onChange));
  } else if(locked) {
    el.innerHTML = `<div class="empty-state">${ICONS.empty}<p>Este reporte no tiene archivo cargado y la edición está bloqueada.</p></div>`;
  } else {
    el.innerHTML = `
      <div class="dropzone" id="dz">
        ${ICONS.upload}
        <div class="dz-title">Arrastra tu Excel aquí</div>
        <div class="dz-sub">o haz clic para buscar el archivo · .xlsx, .xls, .xlsm o .csv</div>
      </div>
    `;
    const dz = el.querySelector('#dz');
    if(dz){
      dz.addEventListener('click', ()=>triggerFilePicker(report, onChange));
      dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('drag'); });
      dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
      dz.addEventListener('drop', (e)=>{ e.preventDefault(); dz.classList.remove('drag'); handleFileUpload(e.dataTransfer.files[0], report, onChange); });
    }
  }
}

            <div class="field-row"><label>Saldo banco/caja $</label><input class="num" type="number" step="any" id="rSaldo" value="${report.resumen.saldoBancoCaja}" placeholder="0.00" ${locked?'disabled':''}></div>
          </div>
          <!-- Calculadora de Flujo Neto en tiempo real -->
          <div class="flujo-neto-card">
            <div style="font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;">Flujo Neto del Período (Ingresos - Gastos - Costos)</div>
            <div id="flujoNetoVal" class="flujo-neto-val">—</div>
          </div>
        </div>
        <div class="card">
          <h3>Notas u observaciones para el administrador</h3>
          <div class="card-sub">Añade cualquier aclaración importante sobre este reporte.</div>
          <div class="field-row"><textarea id="notasEmpresa" placeholder="Ej. Incluye soporte de flete, se anexa comprobante..." ${locked?'disabled':''}>${escapeHtml(report.notasEmpresa||'')}</textarea></div>
        </div>
      </div>
    </div>
  `;

  bindPeriodSelect('rep', ()=>{ previewSheetIndex=0; goTo('reporte'); });

  const actions = document.getElementById('statusActions');
  if(report.status==='borrador'){
    const canSubmit = !!report.file;
    actions.innerHTML = `<button class="btn btn-primary btn-sm" id="submitBtn" ${canSubmit?'':'disabled title="Sube el archivo Excel primero"'}>✓ Cargar reporte definitivo</button>`;
    document.getElementById('submitBtn').addEventListener('click', ()=>submitReport(company.id));
  } else if(report.status==='cargado'){
    actions.innerHTML = `<button class="btn btn-ghost btn-sm" id="reopenBtn">Reabrir para editar</button>`;
    document.getElementById('reopenBtn').addEventListener('click', ()=>reopenReport(company.id));
  } else {
    actions.innerHTML = `<span class="stamp-mark validado">Bloqueado tras validación</span>`;
  }

  renderFileArea('fileArea', report, locked, ()=>goTo('reporte'));
  const previewCard = document.getElementById('previewCard');
  if(report.file){ previewCard.classList.remove('hidden'); renderPreviewBlock(report, 'previewBlock'); }

  function calcNeto(){
    const ing = parseFloat(report.resumen.totalIngresos) || 0;
    const gas = parseFloat(report.resumen.totalGastos) || 0;
    const cos = parseFloat(report.resumen.totalCostos) || 0;
    const net = ing - (gas + cos);
    const el = document.getElementById('flujoNetoVal');
    if(!el) return;
    if(net >= 0){
      el.className = 'flujo-neto-val positive';
      el.innerHTML = `+ $ ${fmt(net)} <span style="font-size:12px;font-weight:600;color:var(--green);">(Superávit)</span>`;
    } else {
      el.className = 'flujo-neto-val negative';
      el.innerHTML = `- $ ${fmt(Math.abs(net))} <span style="font-size:12px;font-weight:600;color:var(--red);">(Déficit)</span>`;
    }
  }
  calcNeto();

  if(!locked){
    const keys=['totalIngresos','totalGastos','totalCostos','saldoBancoCaja'];
    ['rIngresos','rGastos','rCostos','rSaldo'].forEach((id,i)=>{
      document.getElementById(id).addEventListener('input', (e)=>{
        report.resumen[keys[i]]=e.target.value;
        saveDB(DB);
        calcNeto();
      });
    });
    document.getElementById('notasEmpresa').addEventListener('input', (e)=>{ report.notasEmpresa=e.target.value; saveDB(DB); });
  }
}
function submitReport(companyId){
  const user = currentUser();
  const report = ensureReport(companyId, currentPeriodo());
  if(!report.file){ showToast('Debes subir el archivo Excel antes de cargar el reporte.', true); return; }
  report.status='cargado'; report.cargadoPor=user.name; report.cargadoFecha=Date.now(); report.notasAdmin='';
  saveDB(DB); showToast('Reporte cargado. Queda pendiente de validación.'); goTo('reporte');
}
function reopenReport(companyId){
  const report = ensureReport(companyId, currentPeriodo());
  if(report.status==='validado') return;
  report.status='borrador'; report.cargadoPor=null; report.cargadoFecha=null;
  saveDB(DB); showToast('Reporte reabierto para edición.'); goTo('reporte');
}

function renderAdminDashboard(){
  const main = document.getElementById('mainArea');
  let validado=0, cargado=0, pendiente=0;
  const totalCo = DB.companies.length || 1;
  DB.companies.forEach(c=>{
    const r = getReport(c.id, currentPeriodo(), false);
    if(r && r.status==='validado') validado++;
    else if(r && r.status==='cargado') cargado++;
    else pendiente++;
  });

  const pctValidado = Math.round((validado / totalCo) * 100);
  const pctCargado = Math.round((cargado / totalCo) * 100);
  const pctPendiente = Math.max(0, 100 - pctValidado - pctCargado);

  const activity = Object.values(DB.reports)
    .filter(r=>r.cargadoFecha || r.validadoFecha)
    .flatMap(r=>{
      const items=[];
      const c = companyOf(r.companyId);
      if(r.cargadoFecha) items.push({ t:r.cargadoFecha, type:'cargado', text: (c?c.name:'—') + ' cargó ' + periodoLabel(r.periodo) });
      if(r.validadoFecha) items.push({ t:r.validadoFecha, type:'validado', text: (c?c.name:'—') + ' fue validada para ' + periodoLabel(r.periodo) });
      return items;
    }).sort((a,b)=>b.t-a.t).slice(0,8);

  main.innerHTML = `
    <div class="panel-header"><div><div class="panel-title">Dashboard Principal</div><div class="panel-sub">Vista general y estadísticas de ${periodoLabel(currentPeriodo())}</div></div>${periodSelectHTML('dash')}</div>

      <div class="kpi-card"><div class="top-row"><div class="label">Empresas</div><div class="icon-badge blue">${ICONS.building}</div></div><div class="value">${DB.companies.length}</div></div>
      <div class="kpi-card"><div class="top-row"><div class="label">Validados</div><div class="icon-badge green">${ICONS.check}</div></div><div class="value" style="color:var(--green)">${validado} <span style="font-size:13px;font-weight:600;color:var(--text-faint)">(${pctValidado}%)</span></div></div>
      <div class="kpi-card"><div class="top-row"><div class="label">Cargados sin validar</div><div class="icon-badge orange">${ICONS.clock}</div></div><div class="value" style="color:var(--orange)">${cargado} <span style="font-size:13px;font-weight:600;color:var(--text-faint)">(${pctCargado}%)</span></div></div>
      <div class="kpi-card"><div class="top-row"><div class="label">Sin cargar</div><div class="icon-badge red">${ICONS.file}</div></div><div class="value" style="color:var(--text-faint)">${pendiente} <span style="font-size:13px;font-weight:600;color:var(--text-faint)">(${pctPendiente}%)</span></div></div>
    </div>

    <!-- Gráfico visual de distribución -->
    <div class="dist-graphic-card">
      <div class="dist-graphic-header">
        <div class="dist-graphic-title">${ICONS.chart} Cumplimiento de Carga — ${periodoLabel(currentPeriodo())}</div>
        <div style="font-size:12.5px;color:var(--text-dim);">Total: <b>${DB.companies.length} empresas</b></div>
      </div>
      <div class="dist-bar-track">
        <div class="dist-bar-seg validado" style="width:${pctValidado}%" title="Validados: ${pctValidado}%"></div>
        <div class="dist-bar-seg cargado" style="width:${pctCargado}%" title="Pendientes validación: ${pctCargado}%"></div>
        <div class="dist-bar-seg pendiente" style="width:${pctPendiente}%" title="Sin cargar: ${pctPendiente}%"></div>
      </div>
      <div class="dist-legend">
        <div class="dist-legend-item"><span class="dist-legend-dot" style="background:var(--green)"></span>Validados (${validado})</div>
        <div class="dist-legend-item"><span class="dist-legend-dot" style="background:var(--orange)"></span>Cargados sin validar (${cargado})</div>
        <div class="dist-legend-item"><span class="dist-legend-dot" style="background:#C4BDAD"></span>Sin cargar (${pendiente})</div>

          <div class="activity-item"><span class="activity-dot ${a.type}"></span><span class="activity-text">${escapeHtml(a.text)}</span><span class="activity-time">${new Date(a.t).toLocaleString('es-VE')}</span></div>

function renderAdminReportes(){
  const main = document.getElementById('mainArea');
  const periodosSet = new Set([currentPeriodo()]);
  Object.values(DB.reports).forEach(r=>periodosSet.add(r.periodo));
  const periodosList = Array.from(periodosSet).filter(matchesFilter).sort().reverse();

  main.innerHTML = `
    <div class="panel-header"><div><div class="panel-title">Reportes de Empresas</div><div class="panel-sub">Filtra por empresa, estado de datos cargados, mes y año.</div></div>${filterSelectHTML(true, true)}</div>

        <tbody id="adminRows"></tbody>
      </table>
    </div>
  `;
  bindFilterSelect(()=>renderAdminReportes(), true, true);

  const tbody = document.getElementById('adminRows');
  let anyRow=false;
  DB.companies.forEach(c=>{
    if(filterEmpresa !== 'todas' && c.id !== filterEmpresa) return;

    const periodosEmpresa = periodosList.length ? periodosList : [currentPeriodo()];
    periodosEmpresa.forEach(p=>{
      const rep = getReport(c.id, p, false);
      const isLoaded = !!(rep && (rep.status !== 'borrador' || rep.file));
      if(filterCargado === 'si' && !isLoaded) return;
      if(filterCargado === 'no' && isLoaded) return;

      if((filterMes!=='todos' || filterAnio!=='todos') && !rep) return;
      if(filterMes==='todos' && filterAnio==='todos' && filterCargado==='todos' && filterEmpresa==='todas' && !rep && p!==currentPeriodo()) return;
      anyRow = true;
      const r = rep || blankReport(c.id, p);
      const ext = r.file ? getFileExt(r.file.name) : '';
      const cargadoPor = r.cargadoPor || (r.file ? r.file.uploadedBy : null);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div class="company-name-cell"><span class="company-dot"></span>${escapeHtml(c.name)}</div></td>
        <td>${periodoLabel(p)}</td>
        <td>${cargadoPor ? `<span class="user-chip-sm">${ICONS.users} ${escapeHtml(cargadoPor)}</span>` : '<span style="color:var(--text-faint);font-size:12px;">—</span>'}</td>
        <td>${r.file ? `<span class="file-chip">${ICONS.file} ${escapeHtml(r.file.name)} ${ext ? `<span class="ext-badge">${escapeHtml(ext)}</span>` : ''}</span>` : '<span style="color:var(--text-faint);font-size:12px;">Sin archivo</span>'}</td>
        <td><span class="check-icon ${r.status!=='borrador'?'yes':'no'}">${r.status!=='borrador'?'✓':'—'}</span></td>
        <td><span class="check-icon ${r.status==='validado'?'yes':'no'}">${r.status==='validado'?'✓':'—'}</span></td>
        <td><button class="btn btn-ghost btn-sm" data-view="${c.id}|${p}">Ver detalle</button></td>
      `;
      tbody.appendChild(tr);
    });
  });
  if(!anyRow){ tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">${ICONS.empty}<p>Ninguna empresa coincide con los filtros seleccionados.</p></div></td></tr>`; }
  tbody.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [companyId, periodo] = btn.dataset.view.split('|');
      adminDetailTarget = { companyId, periodo }; previewSheetIndex=0;
      currentPage = 'reportes';
      renderPage();
    });
  });
}

    const openPreviewBtn = document.getElementById('openPreviewBtn');
    const previewBlock = document.getElementById('previewBlockAdmin');
    if(openPreviewBtn && previewBlock){
      openPreviewBtn.addEventListener('click', ()=>{
        openPreviewBtn.textContent = 'Cargando vista previa…';
        openPreviewBtn.disabled = true;
        renderPreviewBlock(report, 'previewBlockAdmin');
        openPreviewBtn.classList.add('hidden');
      });
    }
  } else {
    document.getElementById('previewCardAdmin').classList.add('hidden');
    document.getElementById('fileAreaAdmin').innerHTML = `<div class="empty-state">${ICONS.empty}<p>Esta empresa aún no ha subido su archivo Excel para este período.</p></div>`;
  }
  document.getElementById('validateBtn')?.addEventListener('click', ()=>{
    const user = currentUser();
    report.status='validado'; report.validadoPor=user.name; report.validadoFecha=Date.now();
    report.notasAdmin = document.getElementById('notasAdminInput').value.trim();
    saveDB(DB); showToast('Reporte validado.'); renderPage();
  });
  document.getElementById('rejectBtn')?.addEventListener('click', ()=>{
    const notas = document.getElementById('notasAdminInput').value.trim();
    openConfirm('¿Devolver este reporte a la empresa para corrección?', ()=>{
      report.status='borrador'; report.cargadoPor=null; report.cargadoFecha=null; report.validadoPor=null; report.validadoFecha=null;
      report.notasAdmin = notas || 'El administrador solicitó revisar y volver a cargar este reporte.';
      saveDB(DB); showToast('Reporte devuelto a la empresa.');
      adminDetailTarget=null; renderPage();
    });
  });
}

/* =========================================================================
   ADMIN · CHECKLIST DE CUMPLIMIENTO
   ========================================================================= */
function renderAdminChecklist(){
  const main = document.getElementById('mainArea');
  const p = currentPeriodo();
  
  let validados=0, cargados=0, sinCargar=0;
  DB.companies.forEach(c=>{
    const r = getReport(c.id, p, false);
    if(r && r.status==='validado') validados++;
    else if(r && r.status==='cargado') cargados++;
    else sinCargar++;
  });
  const total = DB.companies.length || 1;
  const pctCumplido = Math.round(((validados + cargados) / total) * 100);

  main.innerHTML = `
    <div class="panel-header">
      <div>
        <div class="panel-title">Checklist de Cumplimiento (Control de Carga)</div>
        <div class="panel-sub">Verificación de recepción de reportes Excel y validaciones para ${periodoLabel(p)}.</div>
      </div>
      ${periodSelectHTML('check')}
    </div>

    <div class="kpi-row">
      <div class="kpi-card"><div class="top-row"><div class="label">Empresas Registradas</div><div class="icon-badge blue">${ICONS.building}</div></div><div class="value">${DB.companies.length}</div></div>
      <div class="kpi-card"><div class="top-row"><div class="label">Porcentaje de Carga</div><div class="icon-badge green">${ICONS.chart}</div></div><div class="value" style="color:var(--green)">${pctCumplido}%</div></div>
      <div class="kpi-card"><div class="top-row"><div class="label">Validados</div><div class="icon-badge green">${ICONS.check}</div></div><div class="value" style="color:var(--green)">${validados}</div></div>
      <div class="kpi-card"><div class="top-row"><div class="label">Sin Cargar</div><div class="icon-badge red">${ICONS.clock}</div></div><div class="value" style="color:var(--red)">${sinCargar}</div></div>
    </div>

    <div class="admin-table-wrap">
      <div class="thead-row">
        <h3>Matriz de Control — ${periodoLabel(p)}</h3>
      </div>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Empresa</th>
            <th>Archivo Excel</th>
            <th>Estado</th>
            <th>Validado (Checklist)</th>
            <th>Acciones Directas</th>
          </tr>
        </thead>
        <tbody id="checklistRows"></tbody>
      </table>
    </div>
  `;

  bindPeriodSelect('check', ()=>{ renderAdminChecklist(); });

  const tbody = document.getElementById('checklistRows');
  if(!DB.companies.length){
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">${ICONS.empty}<p>No hay empresas registradas.</p></div></td></tr>`;
    return;
  }

  DB.companies.forEach(c=>{
    const r = getReport(c.id, p, false) || blankReport(c.id, p);
    const ext = r.file ? getFileExt(r.file.name) : '';
    
    let estadoBadge = '';
    if(r.status === 'validado'){
      estadoBadge = `<span class="stamp-mark validado">Validado</span>`;
    } else if(r.status === 'cargado'){
      estadoBadge = `<span class="stamp-mark cargado">Cargado</span>`;
    } else {
      estadoBadge = `<span class="stamp-mark borrador" style="color:var(--red);border-color:#F3D2D0;background:var(--red-soft);">Pendiente</span>`;
    }

    let checklistCol = '';
    if(r.status === 'validado'){
      checklistCol = `<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:12px;border:1px solid #BEE6CE;">✓ Validado</span>`;
    } else if(r.status === 'cargado'){
      checklistCol = `<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;background:var(--orange-soft);color:var(--orange);font-weight:600;font-size:12px;border:1px solid #F0D3A0;">⏳ Por Validar</span>`;
    } else {
      checklistCol = `<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;background:#F6F4EF;color:var(--text-faint);font-size:12px;border:1px solid var(--border-soft);">☐ Pendiente</span>`;
    }

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="company-name-cell">
          <span class="company-dot" style="background:${r.status==='validado'?'var(--green)':(r.status==='cargado'?'var(--orange)':'var(--red)')}"></span>
          ${escapeHtml(c.name)}
        </div>
      </td>
      <td>
        ${r.file ? `<span class="file-chip">${ICONS.file} ${escapeHtml(r.file.name)} ${ext ? `<span class="ext-badge">${escapeHtml(ext)}</span>` : ''}</span>` : '<span style="color:var(--red);font-size:12px;font-weight:600;">❌ Pendiente</span>'}
      </td>
      <td>${estadoBadge}</td>
      <td>${checklistCol}</td>
      <td>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" data-viewdetail="${c.id}|${p}">Ver detalle</button>
          ${r.status==='cargado'?`<button class="btn btn-teal btn-sm" data-quickval="${c.id}|${p}">✓ Validar</button>`:''}
          ${r.status!=='borrador'?`<button class="btn btn-red btn-sm" data-quickreopen="${c.id}|${p}">Devolver</button>`:''}
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[data-viewdetail]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [companyId, periodo] = btn.dataset.viewdetail.split('|');
      adminDetailTarget = { companyId, periodo }; previewSheetIndex=0;
      currentPage = 'reportes'; renderPage();
    });
  });
  tbody.querySelectorAll('[data-quickval]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [companyId, periodo] = btn.dataset.quickval.split('|');
      const r = ensureReport(companyId, periodo);
      const user = currentUser();
      r.status='validado'; r.validadoPor=user.name; r.validadoFecha=Date.now();
      saveDB(DB); showToast('Reporte validado.'); renderAdminChecklist();
    });
  });
  tbody.querySelectorAll('[data-quickreopen]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [companyId, periodo] = btn.dataset.quickreopen.split('|');
      openConfirm('¿Devolver este reporte a la empresa para edición?', ()=>{
        const r = ensureReport(companyId, periodo);
        r.status='borrador'; r.cargadoPor=null; r.cargadoFecha=null; r.validadoPor=null; r.validadoFecha=null;
        saveDB(DB); showToast('Reporte devuelto a borrador.'); renderAdminChecklist();
      });
    });
  });
}

/* =========================================================================
   ADMIN · GESTIÓN DE EMPRESAS
   ========================================================================= */
function renderAdminEmpresas(){
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="panel-header">
      <div>
        <div class="panel-title">Gestión de Empresas</div>
        <div class="panel-sub">Registra y administra las empresas o estaciones asociadas al sistema.</div>
      </div>
    </div>
    <div class="manage-grid">
      <div class="manage-card">
        <h3>Registrar Nueva Empresa</h3>
        <div class="card-sub">Crea una empresa en el sistema. Luego podrás asignarle usuarios en "Usuarios y Accesos".</div>
        <div class="field-row"><label>Nombre de la empresa / estación</label><input id="newCoName" type="text" placeholder="Ej. Centro Óptico Vicente"></div>
        <div class="field-row"><label>RIF / Identificación (Opcional)</label><input id="newCoRif" type="text" placeholder="Ej. J-12345678-0"></div>
        <button class="btn btn-primary" id="createCoBtn" style="width:100%;">Registrar Empresa</button>
      </div>
      <div class="manage-card">
        <h3>Empresas Registradas (${DB.companies.length})</h3>
        <div class="card-sub">Lista de empresas asociadas al sistema.</div>
        <div class="mini-list" id="companyList"></div>
      </div>
    </div>
  `;

  document.getElementById('createCoBtn').addEventListener('click', ()=>{
    const name = document.getElementById('newCoName').value.trim();
    const rif = document.getElementById('newCoRif').value.trim();
    if(!name){ showToast('Ingresa el nombre de la empresa.', true); return; }
    if(DB.companies.some(c=>c.name.toLowerCase()===name.toLowerCase())){ showToast('Esa empresa ya existe.', true); return; }
    const co = { id: uid('c'), name, rif: rif||'', createdAt: Date.now() };
    DB.companies.push(co);
    saveDB(DB); showToast('Empresa registrada correctamente.'); renderAdminEmpresas();
  });

  const list = document.getElementById('companyList');
  DB.companies.forEach(c=>{
    const usersCount = DB.users.filter(x=>x.companyId===c.id).length;
    const item = document.createElement('div');
    item.className = 'mini-list-item';
    item.innerHTML = `
      <div>
        <div style="font-weight:600;">${escapeHtml(c.name)}</div>
        <div class="meta">${c.rif ? 'RIF: '+escapeHtml(c.rif)+' · ' : ''}${usersCount} usuario(s) asociado(s)</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" data-editco="${c.id}">Editar</button>
        <button class="btn btn-red btn-sm" data-delco="${c.id}">Eliminar</button>
      </div>
    `;
    list.appendChild(item);
  });

  list.querySelectorAll('[data-editco]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const co = DB.companies.find(x=>x.id===btn.dataset.editco);
      if(!co) return;
      openPrompt('Nuevo nombre para la empresa', (val)=>{
        if(!val || !val.trim()){ showToast('El nombre no puede estar vacío.', true); return; }
        co.name = val.trim();
        saveDB(DB); showToast('Nombre actualizado.'); renderAdminEmpresas();
      });
    });
  });

  list.querySelectorAll('[data-delco]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.delco;
      openConfirm('¿Eliminar esta empresa? Se desvincularán sus usuarios y se eliminarán sus reportes.', ()=>{
        DB.companies = DB.companies.filter(c=>c.id!==id);
        DB.users.forEach(u=>{ if(u.companyId===id) u.companyId=null; });
        Object.keys(DB.reports).forEach(k=>{ if(DB.reports[k].companyId===id) delete DB.reports[k]; });
        saveDB(DB); showToast('Empresa eliminada.'); renderAdminEmpresas();
      });
    });
  });
}

/* =========================================================================
   ADMIN · GESTIÓN DE USUARIOS Y ACCESOS
   ========================================================================= */
function renderAdminUsuarios(){
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="panel-header">
      <div>
        <div class="panel-title">Usuarios y Accesos</div>
        <div class="panel-sub">Un usuario puede tener rol de empresa o administrador y estar vinculado a una empresa asociada.</div>
      </div>
    </div>
    <div class="manage-grid">
      <div class="manage-card">
        <h3>Registrar Nuevo Usuario</h3>
        <div class="card-sub">Crea un usuario y vinculalo a su empresa correspondiente.</div>
        <div class="field-row"><label>Nombre del Operador / Persona</label><input id="newUName" type="text" placeholder="Ej. Operador Vicente"></div>
        <div class="field-row"><label>Usuario de acceso (username)</label><input id="newUUser" type="text" placeholder="ej. covicente"></div>
        <div class="field-row"><label>Contraseña</label><input id="newUPass" type="text" placeholder="ej. vicente123"></div>
        <div class="field-row">
          <label>Rol de Acceso</label>
          <select id="newURole">
            <option value="empresa" selected>Empresa (Operador)</option>
            <option value="admin">Super Administrador</option>
          </select>
        </div>
        <div class="field-row" id="companySelectWrap">
          <label>Empresa Asociada</label>
          <select id="newUCompany">
            <option value="">-- Sin empresa asociada --</option>
            ${DB.companies.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <button class="btn btn-primary" id="createUBtn" style="width:100%;">Crear Usuario</button>
      </div>
      <div class="manage-card">
        <h3>Usuarios Registrados (${DB.users.length})</h3>
        <div class="card-sub">Restablece contraseñas, cambia empresa asociada o elimina usuarios.</div>
        <div class="mini-list" id="userList"></div>
      </div>
    </div>
  `;

  const roleSel = document.getElementById('newURole');
  const coWrap = document.getElementById('companySelectWrap');
  if(roleSel && coWrap){
    roleSel.addEventListener('change', (e)=>{
      coWrap.style.display = e.target.value === 'admin' ? 'none' : 'block';
    });
  }

  document.getElementById('createUBtn').addEventListener('click', ()=>{
    const name = document.getElementById('newUName').value.trim();
    const uname = document.getElementById('newUUser').value.trim().toLowerCase();
    const pass = document.getElementById('newUPass').value;
    const role = document.getElementById('newURole').value;
    const companyId = document.getElementById('newUCompany').value || null;

    if(!name || !uname || !pass){ showToast('Completa todos los campos obligatorios.', true); return; }
    if(DB.users.some(u=>u.username.toLowerCase()===uname)){ showToast('Ese nombre de usuario ya existe.', true); return; }
    if(role==='empresa' && !companyId){ showToast('Selecciona la empresa asociada para el usuario.', true); return; }

    DB.users.push({ id: uid('u'), username: uname, password: pass, role, name, companyId });
    saveDB(DB); showToast('Usuario creado correctamente.'); renderAdminUsuarios();
  });

  const list = document.getElementById('userList');
  DB.users.forEach(u=>{
    const co = companyOf(u.companyId);
    const item = document.createElement('div');
    item.className = 'mini-list-item';
    item.innerHTML = `
      <div>
        <div style="font-weight:600;">${escapeHtml(u.name)} <span style="font-size:11px;font-weight:700;color:var(--blue);font-family:var(--font-mono);">(@${escapeHtml(u.username)})</span></div>
        <div class="meta">
          <span style="display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;background:${u.role==='admin'?'var(--purple-soft)':'var(--blue-soft)'};color:${u.role==='admin'?'var(--purple)':'var(--blue)'}">${u.role==='admin'?'SUPER ADMIN':'EMPRESA'}</span>
          · ${co ? escapeHtml(co.name) : 'Sin empresa'}
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" data-resetu="${u.id}">Cambiar Clave</button>
        ${u.username!=='superadmin'?`<button class="btn btn-red btn-sm" data-delu="${u.id}">Eliminar</button>`:''}
      </div>
    `;
    list.appendChild(item);
  });

  list.querySelectorAll('[data-resetu]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = DB.users.find(x=>x.id===btn.dataset.resetu);
      if(!u) return;
      openPrompt('Nueva contraseña para @' + u.username, (val)=>{
        if(!val || val.length<4){ showToast('La contraseña debe tener al menos 4 caracteres.', true); return; }
        u.password = val;
        saveDB(DB); showToast('Contraseña restablecida.');
      });
    });
  });

  list.querySelectorAll('[data-delu]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = DB.users.find(x=>x.id===btn.dataset.delu);
      if(!u) return;
      openConfirm('¿Eliminar al usuario @' + u.username + '?', ()=>{
        DB.users = DB.users.filter(x=>x.id!==u.id);
        saveDB(DB); showToast('Usuario eliminado.'); renderAdminUsuarios();
      });
    });
  });
}

/* ---------------- Modales ---------------- */
function openConfirm(message, onConfirm){
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card"><h3>Confirmar acción</h3>
      <p style="color:var(--text-dim);font-size:13.5px;line-height:1.5;">${escapeHtml(message)}</p>
      <div class="modal-actions"><button class="btn btn-ghost btn-sm" id="cancelModal">Cancelar</button><button class="btn btn-red btn-sm" id="confirmModal">Confirmar</button></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelModal').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#confirmModal').addEventListener('click', ()=>{ overlay.remove(); onConfirm(); });
}
function openPrompt(label, onSubmit){
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card"><h3>${escapeHtml(label)}</h3>
      <div class="field-row"><input type="text" id="promptInput" autofocus></div>
      <div class="modal-actions"><button class="btn btn-ghost btn-sm" id="cancelPrompt">Cancelar</button><button class="btn btn-primary btn-sm" style="width:auto;margin-top:0;" id="okPrompt">Guardar</button></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelPrompt').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#okPrompt').addEventListener('click', ()=>{ const val=document.getElementById('promptInput').value; overlay.remove(); onSubmit(val); });
}

boot();
